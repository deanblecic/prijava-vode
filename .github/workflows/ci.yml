name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (Django testovi)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: voda
          POSTGRES_USER: voda
          POSTGRES_PASSWORD: voda
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      POSTGRES_DB: voda
      POSTGRES_USER: voda
      POSTGRES_PASSWORD: voda
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python manage.py test ocitanja
        working-directory: backend

  android:
    name: Android aplikacija
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testovi
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Ključ za potpis
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/prijava-vode.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/prijava-vode.jks" >> "$GITHUB_ENV"
      - name: Izrada APK-a
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then ZADATAK=assembleRelease; else ZADATAK=assembleDebug; fi
          ./gradlew --no-daemon $ZADATAK -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ocitanje-vode-apk
          path: android/app/build/outputs/apk/**/*.apk
