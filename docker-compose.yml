services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_STATIC_ROOT: /app/static
      DJANGO_MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
  media:
